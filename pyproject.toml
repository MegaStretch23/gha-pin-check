[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gha-pin-check"
version = "0.1.0"
description = "Check GitHub Actions workflows for unpinned uses: refs and common risky patterns. Standard library only; text, JSON and SARIF output."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["github-actions", "supply-chain", "security", "sarif", "pinning"]

[project.scripts]
gha-pin-check = "gha_pin_check.cli:main"

[tool.setuptools]
packages = ["gha_pin_check"]
